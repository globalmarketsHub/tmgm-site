<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TMGM Training Portal</title>
  <style>
    :root{--navy:#071225;--blue:#0346ff;--chelsea:#0057b8;--cyan:#44f5ff;--gold:#d7aa45;--text:#f5f8ff;--muted:#9fb2d1;--card:rgba(255,255,255,.08);--card2:rgba(255,255,255,.12)}
    *{box-sizing:border-box}body{margin:0;background:var(--navy);color:var(--text);font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif}a{color:inherit;text-decoration:none}button,input{font:inherit}.page{min-height:100vh;background:radial-gradient(circle at 20% 10%,rgba(0,87,184,.45),transparent 30%),radial-gradient(circle at 85% 20%,rgba(68,245,255,.18),transparent 25%),linear-gradient(135deg,#071225 0%,#071b3d 45%,#001f65 100%)}.container{max-width:1180px;margin:0 auto;padding:32px 20px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:18px 24px;border-bottom:1px solid rgba(255,255,255,.1);background:rgba(7,18,37,.72);position:sticky;top:0;z-index:10}.logo{display:flex;gap:12px;align-items:center;font-weight:900;font-size:28px}.logo-mark{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,#fff,#44f5ff);display:grid;place-items:center;color:#05214a;font-weight:900}.badge{border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);padding:8px 12px;border-radius:999px;color:#dbe8ff;display:inline-flex}.hero{padding:42px;border:1px solid rgba(255,255,255,.12);border-radius:30px;background:linear-gradient(135deg,rgba(255,255,255,.13),rgba(255,255,255,.04));box-shadow:0 24px 80px rgba(0,0,0,.35);position:relative;overflow:hidden}.hero:after{content:"";position:absolute;right:-80px;top:-80px;width:260px;height:260px;border-radius:50%;background:rgba(215,170,69,.18)}.title{font-size:42px;line-height:1.15;margin:0 0 12px;font-weight:900}.sub{color:var(--muted);font-size:17px;line-height:1.7}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-top:24px}.card{border:1px solid rgba(255,255,255,.12);border-radius:24px;background:var(--card);padding:22px;box-shadow:0 18px 50px rgba(0,0,0,.22);transition:.2s;cursor:pointer}.card:hover{transform:translateY(-3px);background:var(--card2);border-color:rgba(68,245,255,.45)}.card h3{margin:0 0 8px;font-size:22px}.muted{color:var(--muted)}.progress{height:9px;background:rgba(255,255,255,.13);border-radius:99px;overflow:hidden;margin-top:16px}.progress span{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--blue),var(--gold))}.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:999px;background:linear-gradient(90deg,#fff,#dff7ff);color:#063fe0;font-weight:900;padding:12px 20px;cursor:pointer}.btn.dark{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.18)}.login-wrap{min-height:100vh;display:grid;place-items:center;padding:20px}.login-card{width:100%;max-width:440px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.09);border-radius:30px;padding:32px;box-shadow:0 30px 90px rgba(0,0,0,.35)}.input{width:100%;padding:14px 16px;border-radius:16px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);color:#fff;margin:8px 0 14px}.input::placeholder{color:#95a7c8}.course{max-width:900px;margin:0 auto}.section{border:1px solid rgba(255,255,255,.12);border-radius:24px;background:rgba(255,255,255,.08);padding:24px;margin:18px 0;line-height:1.8}.section h2{margin-top:0}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:760px}.table th,.table td{padding:14px;border-bottom:1px solid rgba(255,255,255,.1);text-align:left}.table th{background:rgba(255,255,255,.12)}.kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:24px 0}.kpi .card{cursor:default}.kpi .card strong{font-size:28px}.actions{display:flex;gap:12px;flex-wrap:wrap;align-items:center}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.kpi{grid-template-columns:repeat(2,1fr)}.title{font-size:34px}.topbar{flex-wrap:wrap}}@media(max-width:560px){.grid,.kpi{grid-template-columns:1fr}.hero{padding:26px}.topbar{padding:14px}.logo{font-size:22px}.actions{width:100%}}
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    const users=[{id:'u1',name:'Simon Zhang',email:'simon@tmgm.com',password:'123456',role:'employee'},{id:'u2',name:'Trainee User',email:'trainee@tmgm.com',password:'123456',role:'employee'},{id:'admin',name:'Supervisor',email:'admin@tmgm.com',password:'admin123',role:'admin'}];
    const courses=[{id:1,title:'公司产品篇',desc:'外汇、贵金属、能源、数字货币、股指、股票、点差、杠杆、保证金'},{id:2,title:'平台开户与KYC流程',desc:'内容待同步'},{id:3,title:'MT4 / MT5基础操作',desc:'内容待同步'},{id:4,title:'客户门户与入出金流程',desc:'内容待同步'},{id:5,title:'返佣、活动与IB合作',desc:'内容待同步'},{id:6,title:'交易规范与违规识别',desc:'内容待同步'},{id:7,title:'客户沟通与异议处理',desc:'内容待同步'},{id:8,title:'综合演练与案例复盘',desc:'内容待同步'}];
    const day1Sections=[['1. 外汇基础','外汇是以外国货币表示、可用于国际债权债务结算的支付手段。外汇市场由银行、金融机构等组成，具有全球范围、流动性强、24小时连续交易等特点。'],['2. 货币对与交易方向','货币对由基础货币和计价货币组成。基础货币升值或计价货币贬值，货币对上涨；反之下跌。做多代表预期上涨，做空代表预期下跌。'],['3. 点、点值与点差','点是报价变动的最小基本单位。点值代表价格变动一个点对应的盈亏金额。点差是买入价与卖出价之间的差价，也是客户交易成本的重要来源。'],['4. 杠杆、保证金与爆仓比例','保证金交易允许客户用较小资金操作较大名义合约。预付款比例 = 净值 / 已用保证金 × 100%。当比例低于平台规则时，系统可能自动平仓。'],['5. 库存费与持仓成本','库存费也称隔夜利息，取决于交易产品、方向、利率差及持仓时间。计算客户盈亏时，需要同时考虑价格盈亏和持仓成本。'],['6. 产品范围','TMGM培训产品框架包含外汇、贵金属、能源、数字货币、股指、股票等。不同产品的合约规格、杠杆、交易时间、点差与返佣规则不同。'],['7. 学习重点','员工需要能够向客户清楚解释交易成本、点差、杠杆风险、保证金占用、库存费、不同产品交易规则，以及活动手数计算逻辑。']];
    const progressKey='tmgm_training_progress_v1';
    let user=JSON.parse(localStorage.getItem('tmgm_user')||'null');
    let activeDay=null,seconds=0,lastAction=Date.now();
    const app=document.getElementById('app');
    function getProgress(){return JSON.parse(localStorage.getItem(progressKey)||'[]')}
    function saveProgress(row){const all=getProgress();const i=all.findIndex(x=>x.userId===row.userId&&String(x.dayId)===String(row.dayId));if(i>=0)all[i]={...all[i],...row};else all.push(row);localStorage.setItem(progressKey,JSON.stringify(all))}
    function getUserProgress(uid,day){const all=getProgress().filter(x=>x.userId===uid);return day?all.find(x=>String(x.dayId)===String(day)):all}
    function fmt(s=0){const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sec=s%60;if(h)return `${h}小时${m}分钟`;if(m)return `${m}分钟${sec}秒`;return `${sec}秒`}
    function topbar(role){return `<div class="topbar"><div class="logo"><div class="logo-mark">TM</div><div>TMGM Training</div></div><div class="actions"><span class="badge">${role==='admin'?'Supervisor 后台':'Employee 门户'}</span><button class="btn dark" onclick="logout()">退出</button></div></div>`}
    function logout(){localStorage.removeItem('tmgm_user');user=null;location.hash='';render()}
    function guard(role){if(!user||user.role!==role){location.hash='';return false}return true}
    function loginView(){activeDay=null;app.innerHTML=`<main class="page login-wrap"><form class="login-card" onsubmit="login(event)"><div class="logo" style="margin-bottom:24px"><div class="logo-mark">TM</div><div>TMGM Training</div></div><h1 class="title" style="font-size:32px">员工培训系统登录</h1><p class="sub">Chelsea Blue × TMGM 风格内部培训后台</p><input class="input" id="email" value="simon@tmgm.com" placeholder="邮箱"><input class="input" id="password" type="password" value="123456" placeholder="密码"><p id="err" style="color:#ffb4b4"></p><button class="btn" style="width:100%;margin-top:8px">登录</button><p class="muted" style="line-height:1.7">管理员：admin@tmgm.com / admin123<br>员工：simon@tmgm.com / 123456</p></form></main>`}
    function login(e){e.preventDefault();const email=document.getElementById('email').value.trim();const password=document.getElementById('password').value;const found=users.find(u=>u.email===email&&u.password===password);if(!found){document.getElementById('err').textContent='账号或密码错误';return}user=found;localStorage.setItem('tmgm_user',JSON.stringify(user));location.hash=user.role==='admin'?'admin':'employee'}
    function employeeView(){if(!guard('employee'))return;activeDay=null;const cards=courses.map(c=>{const p=getUserProgress(user.id,c.id);const pct=p?.status==='已完成'?100:Math.min(90,Math.floor((p?.seconds||0)/18));return `<a class="card" href="#day/${c.id}"><h3>Day ${c.id}</h3><strong>${c.title}</strong><p class="muted">${c.desc}</p><p>状态：${p?.status||'未开始'}</p><p>时间：${fmt(p?.seconds||0)}</p><div class="progress"><span style="width:${pct}%"></span></div></a>`}).join('');app.innerHTML=`<main class="page">${topbar('employee')}<div class="container"><section class="hero"><h1 class="title">欢迎回来，${user.name}</h1><p class="sub">8天入职培训任务 · 每日独立学习 · 系统记录有效操作时间</p></section><div class="grid">${cards}<a class="card" href="#comprehensive"><h3>综合学习</h3><strong>综合资料 / 测验</strong><p class="muted">用于后续整合活动规则、产品规则、违规交易、客户沟通案例。</p><div class="progress"><span style="width:15%"></span></div></a></div></div></main>`}
    function dayView(id){if(!guard('employee'))return;const c=courses.find(x=>x.id===id);const p=getUserProgress(user.id,id);activeDay=id;seconds=p?.seconds||0;let body=id===1?day1Sections.map(s=>`<section class="section"><h2>${s[0]}</h2><p>${s[1]}</p></section>`).join('')+`<section class="section"><h2>课后任务</h2><ol><li>用客户能听懂的话解释“点差就是交易成本”。</li><li>举例说明杠杆、保证金、爆仓比例之间的关系。</li><li>说明为什么持仓过夜可能产生库存费。</li><li>整理常见产品：外汇、黄金、原油、股指、股票的区别。</li></ol></section>`:`<section class="section"><h2>内容待同步</h2><p>该模块框架已建立，后续可上传 PDF、图片、视频或测验题。</p></section>`;app.innerHTML=`<main class="page">${topbar('employee')}<div class="container course"><a href="#employee" class="badge">← 返回员工首页</a><div style="height:18px"></div><section class="hero"><h1 class="title">Day ${id} · ${c?.title||''}</h1><p class="sub">${c?.desc||''}</p></section><div class="section" style="display:flex;justify-content:space-between;align-items:center;gap:16px"><div><div class="muted">有效学习时间（防挂机）</div><h2 id="timer" style="margin:4px 0 0">${fmt(seconds)}</h2></div><button class="btn" onclick="completeDay()">标记完成</button></div>${body}</div></main>`}
    function completeDay(){if(!user||!activeDay)return;saveProgress({userId:user.id,dayId:activeDay,seconds,status:'已完成',lastActiveAt:new Date().toISOString(),completedAt:new Date().toISOString()});alert('已标记为完成')}
    function comprehensiveView(){if(!guard('employee'))return;activeDay=null;app.innerHTML=`<main class="page">${topbar('employee')}<div class="container course"><a href="#employee" class="badge">← 返回员工首页</a><div style="height:18px"></div><section class="hero"><h1 class="title">综合学习 / 综合测验</h1><p class="sub">后续可放：活动规则、点差返佣、违规交易、客户异议处理、产品测验。</p></section><section class="section"><h2>当前状态</h2><p>综合模块已预留。下一步可以接入题库、视频、PDF阅读器与考试评分。</p></section></div></main>`}
    function reportRows(){const progress=getProgress();return users.filter(u=>u.role==='employee').flatMap(emp=>courses.map(c=>{const p=progress.find(x=>x.userId===emp.id&&Number(x.dayId)===c.id);return {name:emp.name,email:emp.email,day:`Day ${c.id}`,title:c.title,status:p?.status||'未开始',time:fmt(p?.seconds||0),seconds:p?.seconds||0,last:p?.lastActiveAt||'',completed:p?.completedAt||'',userId:emp.id}}))}
    function adminView(){if(!guard('admin'))return;activeDay=null;const rows=reportRows();const total=rows.reduce((s,r)=>s+r.seconds,0),done=rows.filter(r=>r.status==='已完成').length;const tr=rows.map(r=>`<tr><td>${r.name}</td><td>${r.day}</td><td>${r.title}</td><td>${r.status}</td><td>${r.time}</td><td><a class="badge" href="#admin/employee/${r.userId}">查看</a></td></tr>`).join('');app.innerHTML=`<main class="page">${topbar('admin')}<div class="container"><section class="hero"><h1 class="title">监督者后台</h1><p class="sub">查看员工8天培训进度、有效浏览操作时间、完成情况，并导出报告。</p><button class="btn" onclick="exportCsv()">导出报告</button></section><div class="kpi"><div class="card"><div class="muted">员工人数</div><strong>2</strong></div><div class="card"><div class="muted">课程模块</div><strong>${courses.length}</strong></div><div class="card"><div class="muted">已完成模块</div><strong>${done}</strong></div><div class="card"><div class="muted">总有效时间</div><strong>${fmt(total)}</strong></div></div><section class="section"><h2>员工进度报告</h2><div class="table-wrap"><table class="table"><thead><tr><th>员工</th><th>Day</th><th>模块</th><th>状态</th><th>有效时间</th><th>详情</th></tr></thead><tbody>${tr}</tbody></table></div></section></div></main>`}
    function employeeReport(id){if(!guard('admin'))return;activeDay=null;const emp=users.find(u=>u.id===id);const progress=getProgress();const tr=courses.map(c=>{const p=progress.find(x=>x.userId===id&&Number(x.dayId)===c.id);return `<tr><td>Day ${c.id}</td><td>${c.title}</td><td>${p?.status||'未开始'}</td><td>${fmt(p?.seconds||0)}</td><td>${p?.lastActiveAt||'-'}</td><td>${p?.completedAt||'-'}</td></tr>`}).join('');app.innerHTML=`<main class="page">${topbar('admin')}<div class="container"><a href="#admin" class="badge">← 返回管理员后台</a><div style="height:18px"></div><section class="hero"><h1 class="title">${emp?.name||''} 的学习详情</h1><p class="sub">${emp?.email||''}</p></section><section class="section"><div class="table-wrap"><table class="table"><thead><tr><th>Day</th><th>课程</th><th>状态</th><th>有效时间</th><th>最后操作</th><th>完成时间</th></tr></thead><tbody>${tr}</tbody></table></div></section></div></main>`}
    function exportCsv(){const rows=reportRows();const header=['员工姓名','邮箱','Day','模块名称','状态','有效学习时间','秒数','最后操作时间','完成时间'];const csv='\ufeff'+[header.join(','),...rows.map(r=>[r.name,r.email,r.day,r.title,r.status,r.time,r.seconds,r.last,r.completed].map(v=>`"${String(v).replaceAll('"','""')}"`).join(','))].join('\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='TMGM员工培训进度报告.csv';a.click();URL.revokeObjectURL(a.href)}
    function render(){const h=location.hash.replace(/^#/,'');if(!h)return loginView();if(h==='employee')return employeeView();if(h==='comprehensive')return comprehensiveView();if(h==='admin')return adminView();if(h.startsWith('day/'))return dayView(Number(h.split('/')[1]));if(h.startsWith('admin/employee/'))return employeeReport(h.split('/')[2]);loginView()}
    ['mousemove','mousedown','keydown','scroll','touchstart','click'].forEach(e=>window.addEventListener(e,()=>lastAction=Date.now()));
    setInterval(()=>{if(!user||user.role!=='employee'||!activeDay)return;if(Date.now()-lastAction>=60000||document.visibilityState!=='visible')return;seconds+=1;saveProgress({userId:user.id,dayId:activeDay,seconds,status:seconds>5?'学习中':'未开始',lastActiveAt:new Date().toISOString()});const el=document.getElementById('timer');if(el)el.textContent=fmt(seconds)},1000);
    window.addEventListener('hashchange',render);render();
  </script>
</body>
</html>
