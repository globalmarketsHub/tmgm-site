d="time">00:00</b> <span id="status">Cursor outside</span></div></header><main class="wrap"><section class="hero"><article class="card"><p class="eyebrow">DAY 2</p><h1>账户类型与客户画像</h1><p class="muted">学习不同账户、客户需求识别与基础开户流程。</p></article><div class="fig"><img src="https://tmgm-static.oss-cn-hongkong.aliyuncs.com/image/about/chelsea-bg.webp" alt="TMGM Chelsea"></div></section><section class="grid"><article class="card"><h2>学习模块</h2><ul><li>账户类型差异</li><li>客户需求标签</li><li>开户链接与资料检查</li></ul></article><article class="card"><h2>实操任务</h2><p class="muted">根据 3 个模拟客户案例匹配账户类型，并说明理由。</p></article><article class="card"><h2>考核标准</h2><p class="muted">完成客户画像表，主管检查表达是否合规。</p></article></section><p><a class="btn outline" href="day-1.html">上一天</a> <a class="btn" href="day-3.html">下一天</a> <a class="btn outline" href="index.html">返回门户</a></p></main><script>let s=0,i=false,l=0;function f(){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}function m(){i=true;l=Date.now()}['mousemove','click','keydown','scroll'].forEach(e=>addEventListener(e,m,{passive:true}));document.addEventListener('mouseleave',()=>i=false);setInterval(()=>{let on=i&&Date.now()-l<60000;if(on)s++;time.textContent=f();status.textContent=on?'Active':i?'Idle':'Cursor outside'},1000)</script></body></html>
